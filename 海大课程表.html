    '<div class="hint">周次按它推算，错一周整个日历都错——看着上面的推算调，对上校历/教务就行。</div></div>'+
    '<div class="frow"><label>每节课时间（一行一节 HH:MM-HH:MM）</label><textarea id="sTT" class="mono">'+esc(t)+'</textarea>'+
    '<div class="hint">行数=每天节次。已预填海大官方作息；学校调整了就改。</div></div>'+
    '<div class="sheetErr" id="sErr"></div>'+
    grp('记录到这学期')+
    '<div class="linkrow" id="sTodo"><b>日程备注</b><small>'+(state.todos.length?('已设 '+state.todos.length+' 条'):'考试、截止日期')+'</small><span class="arr">›</span></div>'+
    '<div class="linkrow" id="sCalAd"><b>校历调整</b><small>'+((nH+nS+nM)?calSum:'假期 / 调休 / 调课')+'</small><span class="arr">›</span></div>'+
    '<div class="linkrow" id="sRc" style="border-bottom:none"><b>晚点名</b><small>'+(state.rollCall?rcSum:'宿舍的，不算课')+'</small><span class="arr">›</span></div>'+
    '<div class="sheetbtns" style="margin-top:14px"><button class="pri" id="sSave">保存</button></div>'+
    grp('危险区')+
    '<div class="sheetbtns"><button id="sClear" class="del">清空当前学期课程</button><button id="sDemo">恢复演示数据</button></div>');
  // 主题/皮肤：视觉卡片（小样=实际配色，取自各皮肤 CSS 真值）
  const renderTCards=()=>{
    const th=settings.theme==='dark'?'dark':'light';
    const skin=settings.skin||'qingxin';
    const P=SKIN_PREV;
    const card=(key,label,sub,pv,on,tap)=>
      '<button type="button" class="tcard'+(on?' on':'')+'" data-tap="'+tap+'" data-key="'+key+'">'+
      '<span class="prev" style="background:'+pv.bg+'">'+
        pv.c.map((c,i)=>'<i style="left:'+(8+i*24)+'%;width:18%;background:'+c+'"></i>').join('')+
        '<i class="acc" style="right:8%;background:'+pv.acc+'"></i>'+
      '</span><b>'+label+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</button>';
    document.getElementById('tcTheme').innerHTML=
      card('light','浅色','',P[skin].light,th!=='dark','theme')+
      card('dark','深色','',P[skin].dark,th==='dark','theme');
    document.getElementById('tcSkin').innerHTML=
      [['qingxin','清新蓝'],['spring','春绿'],['sakura','樱花粉'],['yang','暖阳'],['mist','海雾青'],['wisteria','紫藤']]
        .map(x=>card(x[0],x[1],'',P[x[0]][th],skin===x[0],'skin')).join('');
    document.querySelectorAll('.tcard').forEach(b=>b.onclick=()=>{
      if(b.dataset.tap==='theme') settings.theme=b.dataset.key; else settings.skin=b.dataset.key;
      saveSettings(); applyTheme(); renderTCards();
    });
  };
  renderTCards();  const bindSw=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=()=>{ el.classList.toggle('on'); fn(el.classList.contains('on')); }; };
  bindSw('swWk', v=>{ settings.weekend=v; saveSettings(); render(); });
  bindSw('swAll', v=>{ settings.showAll=v; saveSettings(); render(); });
  document.querySelectorAll('#segSec button').forEach(b=>b.onclick=()=>{ // 3.35 前一直没绑（真bug）
    settings.secMode=b.dataset.v; saveSettings(); render();
    document.querySelectorAll('#segSec button').forEach(x=>x.classList.toggle('on',x===b));
  });
  bindSw('swPair', v=>{ settings.pairOn=v; saveSettings(); render(); });
  document.getElementById('sTodo').onclick=openTodos;
  const qa=document.getElementById('qAll');
  if(qa) qa.onclick=e=>{
    e.stopPropagation();
    const ex=document.getElementById('expAll');
    ex.style.display = ex.style.display==='none' ? 'block' : 'none';
  };
  const fmp=document.getElementById('fmPrev'); // 开学日期 → 实时推算当前周（学超级课程表）
  const updFm=()=>{
    const v=document.getElementById('sFM').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ fmp.textContent=''; return; }
    try{
      const w=Math.floor((mondayOf(Date.now())-parseYmd(v))/6048e5)+1;
      fmp.textContent = w<1 ? '按这个日期还没开学' : (w>40 ? '按这个日期已超过 40 周，日期应该不对' : '按这个日期推算，今天是第 '+w+' 周');
    }catch(e){}
  };
  document.getElementById('sFM').addEventListener('change',updFm); updFm();
  document.getElementById('sCal').onclick=()=>{ // 周数校正（借鉴 WakeUp setCurrentWeek）——即点即存
    const n=+document.getElementById('sWk').value;
    if(!(n>=1&&n<=40)) return toast('周数要在 1-40 之间');
    const fm=fmtYmd(mondayOf(Date.now())-(n-1)*6048e5);
    state.meta.firstMonday=fm; save();
    const inp=document.getElementById('sFM');
    inp.value=fm; inp.dispatchEvent(new Event('change'));
    toast('开学日期改成 '+fm+' 了');
  };
  document.getElementById('sCalAd').onclick=()=>openCalEdit();
  document.getElementById('sRc').onclick=openRollCall;
  // 壁纸：选图→canvas 压缩（长边1280/JPEG 82%）→存 settings；超限自动回滚
  document.getElementById('wpPick').onclick=()=>document.getElementById('wpFile').click();
  const wpClear=document.getElementById('wpClear');
  if(wpClear) wpClear.onclick=()=>{
    delete settings.wallpaper; saveSettings(); applyTheme(); render();
    toast('已恢复纯色底');
  };
  document.getElementById('wpFile').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1280, k=Math.min(1, MAX/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*k)), h=Math.max(1,Math.round(img.height*k));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#faf8f2'; ctx.fillRect(0,0,w,h); // 透明 PNG 转 JPEG 的垫底
        ctx.drawImage(img,0,0,w,h);
        let url; try{ url=cv.toDataURL('image/jpeg',0.82); }catch(err){ return toast('这张图处理不了，换一张试试'); }
        if(url.length>2.5e6) return toast('压缩完还是太大，换张小一点的图');
        const prev=settings.wallpaper;
        settings.wallpaper=url;
        try{ localStorage.setItem(SET_KEY, JSON.stringify(settings)); }
        catch(err){ settings.wallpaper=prev; saveSettings(); return toast('浏览器空间不够存这张图，换张小点的'); }
        applyTheme(); closeSheet(); render(); toast('壁纸已换上');
      };
      img.onerror=()=>toast('这张图读取失败，换一张试试');
      img.src=r.result;
    };
    r.readAsDataURL(f);
    e.target.value=''; // 允许连选同一张
  };
  document.getElementById('sSave').onclick=()=>{
    const err=document.getElementById('sErr'); if(err) err.textContent='';
    state.meta.semesterName=document.getElementById('sName').value.trim()||'我的课表';
    state.meta.firstMonday=document.getElementById('sFM').value||state.meta.firstMonday;
    const lines=document.getElementById('sTT').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const tt=[];
    for(const l of lines){
      const m=l.match(/^(\d{1,2}:\d{2})\s*[-~]\s*(\d{1,2}:\d{2})$/);
      const msg='时间格式不对：「'+l+'」，应如 08:20-09:05';
      if(!m){ if(err) err.textContent=msg; return; }
      tt.push({s:m[1].padStart(5,'0'),e:m[2].padStart(5,'0')});
    }
    if(tt.length<4){ if(err) err.textContent='至少 4 节/天'; return; }
    const N=tt.length;
    state.courses.forEach(c=>{c.startSection=Math.min(c.startSection,N);c.endSection=Math.min(c.endSection,N);});
    state.timeTable=tt;
    const ok=save(); closeSheet(); render();
    if(ok) toast('学期信息已保存');
  };
  document.getElementById('sClear').onclick=()=>{
    if(!confirm('清空当前学期的全部课程？')) return;
    const snap=JSON.stringify(db);
    state.courses=[]; state.meta.demo=false;
    const ok=save(); closeSheet(); render(); if(ok) toast('已清空，可撤回',{label:'撤回',fn:()=>restoreUndo(snap)});
  };
  document.getElementById('sDemo').onclick=()=>{
    if(state.courses.length && !confirm('用演示数据覆盖当前课表？')) return;
    const snap=JSON.stringify(db);
    state=freshState(true); save(); closeSheet(); render();
    toast('已换成演示数据',{label:'撤回',fn:()=>restoreUndo(snap)});
  };
}

/* ── 校历调整：假期 / 调休 / 调课（设计见 1-校历与调课设计.md） ── */
function openCalEdit(){
  const grpLbl=t=>'<div class="grp" style="margin-bottom:8px"></div><div class="frow" style="margin-bottom:8px"><label>'+t+'</label></div>';
  const holRows=state.holidays.length?state.holidays.map((h,i)=>
    '<div class="semrow"><div class="si"><b>'+esc(h.name||'假期')+'</b><small>'+h.start+(h.end!==h.start?' ~ '+h.end:'（就一天）')+'</small></div>'+
    '<button class="dl2" data-del="h:'+i+'">删</button></div>').join('')
    :'<div class="hint">比如国庆 10-01 ~ 10-07，设了之后这几天的课自动变虚不上。</div>';
  const swapRows=state.daySwaps.length?state.daySwaps.map((s,i)=>
    '<div class="semrow"><div class="si"><b>'+dateCn(s.dst)+' 上课</b><small>按 '+dateCn(s.src)+' 的课表</small></div>'+
    '<button class="dl2" data-del="s:'+i+'">删</button></div>').join('')
    :'<div class="hint">整天对调：比如 10/24（周六）按 10/21（周三）的课表上课。</div>';
  const mvRows=state.moves.length?state.moves.map((m,i)=>{
    const c=state.courses.find(x=>x.id===m.courseId);
    const sec=(a,b)=>'第'+a+(b>a?'-'+b:'')+'节';
    return '<div class="semrow"><div class="si"><b>'+esc(c?c.name:'（课程已删）')+'</b>'+
      '<small>'+dateCn(m.from)+' '+sec(m.s1,m.s2)+' → '+dateCn(m.to)+' '+sec(m.t1,m.t2)+'</small></div>'+
      '<button class="dl2" data-del="m:'+i+'">删</button></div>';}).join('')
    :'<div class="hint">老师单独说"这节课挪个时间"时用。</div>';
  openSheet('<h3>校历调整<button class="x" id="shX"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>'+
    '<div class="hint" style="margin-bottom:2px">放假、补课、调课记在这里，课表自动跟着变。</div>'+
    grpLbl('假期（放假日）')+holRows+
    '<div class="sheetbtns"><button id="calAddH">＋ 添加假期</button></div>'+
    grpLbl('调休（整天对调，如周六补周三）')+swapRows+
    '<div class="sheetbtns"><button id="calAddS">＋ 添加调休</button></div>'+
    grpLbl('调课（单节课挪日期/节次）')+mvRows+
    '<div class="sheetbtns"><button id="calAddM">＋ 添加调课</button></div>');
  document.getElementById('calAddH').onclick=openCalAddHol;
  document.getElementById('calAddS').onclick=openCalAddSwap;
  document.getElementById('calAddM').onclick=()=>{ if(!state.courses.length) return toast('还没有课程，先去加课'); openCalAddMove(); };
  document.querySelectorAll('#sheet [data-del]').forEach(b=>b.onclick=()=>{
    const parts=b.dataset.del.split(':'), k=parts[0], i=+parts[1];
    const snap=JSON.stringify(db);
    if(k==='h') state.holidays.splice(i,1);
    else if(k==='s') state.daySwaps.splice(i,1);
    else state.moves.splice(i,1);
    save(); render(); openCalEdit(); toast('已删除，可撤回',{label:'撤回',fn:()=>restoreUndo(snap)});
  });
}
function openCalAddHol(){
  const today=fmtYmd(Date.now());
  openSheet('<h3>添加假期<button class="x" id="shX"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>'+
    '<div class="frow"><label>假期名字（通知里怎么叫就怎么填）</label><input id="hName" maxlength="20" placeholder="如：国庆、校庆、五一"></div>'+
    '<div class="f2"><div class="frow"><label>开始日期</label><input type="date" id="hS" value="'+today+'"></div>'+
    '<div class="frow"><label>结束日期</label><input type="date" id="hE" value="'+today+'"></div></div>'+
    '<div class="hint">就放一天的话，两天填同一天。这段时间里的课会变虚，不算上课、也不进日历导出。</div>'+
    '<div class="sheetErr" id="hErr"></div>'+
    '<div class="sheetbtns"><button id="hBack">完成</button><button class="pri" id="hGo">添加</button></div>');
  document.getElementById('hBack').onclick=openCalEdit;
  document.getElementById('hGo').onclick=()=>{
    const err=document.getElementById('hErr'); err.textContent='';
    let a=document.getElementById('hS').value, b=document.getElementById('hE').value;
    if(!a||!b){ err.textContent='两个日期都要填'; return; }
    if(a>b){ const t=a; a=b; b=t; } // end>=start 自动交换
    state.holidays.push({name:document.getElementById('hName').value.trim()||'假期',start:a,end:b});
    save(); render(); openCalAddHol();
    document.getElementById('hS').value=''; document.getElementById('hE').value='';
    toast('已加好，接着填下一条');
  };
}
function openCalAddSwap(){
  openSheet('<h3>添加调休<button class="x" id="shX"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>'+
    '<div class="hint" style="margin-bottom:10px">标准场景：周六/周日补某天的课。先填真正要上课的那天，再填按哪天的课表上。</div>'+
    '<div class="f2"><div class="frow"><label>补课日（这天要上课）</label><input type="date" id="swDst"></div>'+
    '<div class="frow"><label>源日（按这天的课表）</label><input type="date" id="swSrc"></div></div>'+
    '<div class="hint" id="swPrev" style="color:var(--acc);font-weight:600"></div>'+
    '<div class="sheetErr" id="swErr"></div>'+
    '<div class="sheetbtns"><button id="swBack">完成</button><button class="pri" id="swGo">添加</button></div>');
  const upd=()=>{
    const d=document.getElementById('swDst').value, s=document.getElementById('swSrc').value;
    document.getElementById('swPrev').textContent=(d&&s)?(dateCn(d)+' 按 '+dateCn(s)+' 的课表上课'):'';
  };
  document.getElementById('swDst').addEventListener('change',upd);
  document.getElementById('swSrc').addEventListener('change',upd);
  document.getElementById('swBack').onclick=openCalEdit;
  document.getElementById('swGo').onclick=()=>{
    const err=document.getElementById('swErr'); err.textContent='';
    const dst=document.getElementById('swDst').value, src=document.getElementById('swSrc').value;
    if(!dst||!src){ err.textContent='两个日期都要填'; return toast('日期还没填全'); }
    if(dst===src){ err.textContent='两个日期不能是同一天'; return; }
    if(state.daySwaps.some(x=>x.dst===dst)){ err.textContent=dateCn(dst)+' 已经设过调休了'; return; }
    if(state.daySwaps.some(x=>x.dst===src)){ err.textContent='不能链着设：'+dateCn(src)+' 本身是补课日'; return; }
    if(inHoliday(dst)&&!confirm('补课日落在假期里，确定这天真的要上课？')) return;
    state.daySwaps.push({src,dst});
    save(); render(); openCalAddSwap();
    document.getElementById('swDst').value=''; document.getElementById('swSrc').value=''; upd();
    toast('已加好，接着填下一条');
  };
}
function openCalAddMove(){
  let selId=null, v1=1, v2=2;
  openSheet('<h3>添加调课<button class="x" id="shX"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>'+
    '<div class="frow"><label>选一门课 *</label><div id="mvList">'+
    state.courses.map(c=>'<button type="button" class="mvrow" data-id="'+esc(c.id)+'"><b>'+esc(c.name)+'</b><small>'+
      DAY_NAMES[c.dayOfWeek-1]+' 第'+c.startSection+(c.endSection>c.startSection?'-'+c.endSection:'')+'节 · '+weeksText(c.weeks)+(c.room?' · '+esc(c.room):'')+'</small></button>').join('')+
    '</div></div>'+
    '<div class="f2"><div class="frow"><label>原日期（这节课原本在哪天）</label><input type="date" id="mFrom"></div>'+
    '<div class="frow"><label>新日期（挪到哪天）</label><input type="date" id="mTo"></div></div>'+
    '<div class="hint" id="mFromChk"></div>'+
    '<div class="frow"><label>新节次</label><div class="secbtnrow">'+
    '<button type="button" class="secbtn" id="mT1Btn"></button><span class="secarr">到</span><button type="button" class="secbtn" id="mT2Btn"></button>'+
    '<div class="secpop" id="mSecPop"></div></div></div>'+
    '<div class="hint" id="mPrev" style="color:var(--acc);font-weight:600"></div>'+
    '<div class="sheetErr" id="mErr"></div>'+
    '<div class="sheetbtns"><button id="mBack">完成</button><button class="pri" id="mGo">添加</button></div>');
  const N=state.timeTable.length;
  const refresh=()=>{
    document.getElementById('mT1Btn').textContent='第 '+v1+' 节';
    document.getElementById('mT2Btn').textContent='第 '+v2+' 节';
    const c=state.courses.find(x=>x.id===selId);
    const f=document.getElementById('mFrom').value, t=document.getElementById('mTo').value;
    document.getElementById('mPrev').textContent=(c&&f&&t)
      ?(c.name+'：'+dateCn(f)+' 第'+c.startSection+(c.endSection>c.startSection?'-'+c.endSection:'')+'节 → '+dateCn(t)+' 第'+v1+(v2>v1?'-'+v2:'')+'节'):'';
  };
  document.querySelectorAll('#mvList .mvrow').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#mvList .mvrow').forEach(x=>x.classList.toggle('on',x===b));
    selId=b.dataset.id;
    const c=state.courses.find(x=>x.id===selId);
    v1=c.startSection; v2=c.endSection; // 新节次默认跟原节次一样
    document.getElementById('mFromChk').textContent='';
    refresh();
  });
  let popOpen=false;
  const secPop=document.getElementById('mSecPop');
  const closePop=()=>{ popOpen=false; secPop.classList.remove('open'); };
  const openPop=which=>{
    popOpen=true; secPop.classList.add('open');
    secPop.innerHTML=Array.from({length:N},(_,i)=>'<button type="button" data-v="'+(i+1)+'"'+(i+1===(which===1?v1:v2)?' class="on"':'')+'>'+(i+1)+'</button>').join('');
    secPop.querySelectorAll('button').forEach(x=>x.onclick=()=>{
      const val=+x.dataset.v;
      if(which===1){ v1=val; if(v1>v2) v2=v1; } else { v2=val; if(v2<v1) v1=v2; }
      refresh(); closePop();
    });
  };
  document.getElementById('mT1Btn').onclick=()=>openPop(1);
  document.getElementById('mT2Btn').onclick=()=>openPop(2);
  document.getElementById('sheet').addEventListener('click',e=>{ // 点弹层外收起
    if(!popOpen) return;
    if(e.target.closest('.secbtn')||e.target.closest('.secpop')) return;
    closePop();
  });
  document.getElementById('mFrom').addEventListener('change',()=>{
    const chk=document.getElementById('mFromChk');
    const c=state.courses.find(x=>x.id===selId);
    const v=document.getElementById('mFrom').value;
    if(!c||!v){ chk.textContent=''; return; }
    const ts=parseYmd(v), dow=new Date(ts).getDay()||7, wk=weekOf(ts);
    const ok=c.dayOfWeek===dow&&c.weeks.includes(wk);
    chk.textContent=ok?'✓ 这天有这门课':'⚠ 按课表这天没有这门课（它排在'+DAY_NAMES[c.dayOfWeek-1]+'），检查下日期';
    chk.style.color=ok?'var(--acc)':'var(--hl)';
    refresh();
  });
  document.getElementById('mTo').addEventListener('change',refresh);
  document.getElementById('mBack').onclick=openCalEdit;
  document.getElementById('mGo').onclick=()=>{
    const err=document.getElementById('mErr'); err.textContent='';
    const c=state.courses.find(x=>x.id===selId);
    if(!c){ err.textContent='先在上面选一门课'; return; }
    const from=document.getElementById('mFrom').value, to=document.getElementById('mTo').value;
    if(!from||!to){ err.textContent='两个日期都要填'; return toast('日期还没填全'); }
    if(from===to&&v1===c.startSection&&v2===c.endSection){ err.textContent='日期和节次都没变，等于没调'; return toast('日期和节次都没变'); }
    const ts=parseYmd(from), dow=new Date(ts).getDay()||7, wk=weekOf(ts);
    if(!(c.dayOfWeek===dow&&c.weeks.includes(wk))&&!confirm('按课表，'+dateCn(from)+'这天没有这门课。仍然添加？')) return;
    const hol=inHoliday(to);
    if(hol&&!confirm('新日期在假期「'+(hol.name||hol.start)+'」里，确定要调到这天？')) return;
    state.moves=state.moves.filter(m=>!(m.courseId===c.id&&m.from===from)); // 同一节课重调=覆盖旧调法
    state.moves.push({courseId:c.id,from,s1:c.startSection,s2:c.endSection,
                      to,t1:Math.min(v1,v2),t2:Math.max(v1,v2)});
    save(); render(); openCalAddMove();
    document.getElementById('mFrom').value=''; document.getElementById('mTo').value='';
    document.getElementById('mFromChk').textContent='';
    toast('已加好，接着填下一条');
  };
  refresh();
}

  document.getElementById('rcGo').onclick=()=>{
    const err=document.getElementById('rcErr'); err.textContent='';

/* ── ICS 日历导出 ─────────────────── */
function pad2(n){ return (n<10?'0':'')+n; }
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
/* RFC5545 折行：单行超 75 字节按 UTF-8 边界折成续行（前缀空格） */
function foldICS(text){
  const enc=new TextEncoder(), dec=new TextDecoder();
  return text.split('\r\n').map(line=>{
    const b=enc.encode(line);
    if(b.length<=75) return line;
    const parts=[]; let pos=0, first=true;
    while(pos<b.length){
      const lim=first?75:74;
      let end=Math.min(pos+lim,b.length);
      while(end<b.length && (b[end]&0xC0)===0x80) end--; // 不劈开多字节汉字
      parts.push((first?'':' ')+dec.decode(b.subarray(pos,end)));
      first=false; pos=end;
    }
    return parts.join('\r\n');
  }).join('\r\n');
}
function buildICS(){
  const fm=parseYmd(state.meta.firstMonday);
  const alarmM=settings.icalAlarm||15;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//haida-schedule//CN','CALSCALE:GREGORIAN',
           'X-WR-CALNAME:'+icsEsc(state.meta.semesterName),
           'BEGIN:VTIMEZONE','TZID:Asia/Shanghai','BEGIN:STANDARD',
           'DTSTART:19700101T000000','TZOFFSETFROM:+0800','TZOFFSETTO:+0800','TZNAME:CST',
           'END:STANDARD','END:VTIMEZONE'];
  let n=0;
  // 按天走校历覆盖层：假期不上、调休上源日课表、调课按真实日期节次——和页面显示永远一致
  let endTs=fm+40*6048e5;
  state.moves.forEach(m=>{ const t=parseYmd(m.to); if(t>endTs) endTs=t+DAY; });
  state.daySwaps.forEach(s=>{ const t=parseYmd(s.dst); if(t>endTs) endTs=t+DAY; });
  for(let ts=fm; ts<=endTs; ts+=DAY){
    const {plan,list}=occurrencesFor(ts);
    const d=new Date(ts);
    const ymd=d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate());
    list.forEach(o=>{
      if(o.ghost) return; // 假期里/被调走的课不生成
      const c=o.c;
      const plain=!plan.swap&&!o.moveTo; // 没被校历动过的课沿用旧 UID，日历 App 里不产生重复条目
      const uidKey=plain?weekOf(ts):ymd;
      const tsA=state.timeTable[o.s1-1].s.split(':'), teA=state.timeTable[o.s2-1].e.split(':');
      const startHm=pad2(+tsA[0])+pad2(+tsA[1]), endHm=pad2(+teA[0])+pad2(+teA[1]);
      L.push('BEGIN:VEVENT',
        'UID:sched-'+c.id+'-'+uidKey+'@local',
        'DTSTART;TZID=Asia/Shanghai:'+ymd+'T'+startHm+'00',
        'DTEND;TZID=Asia/Shanghai:'+ymd+'T'+endHm+'00',
        'SUMMARY:'+icsEsc(c.name),
        'LOCATION:'+icsEsc(c.room||''),
        'DESCRIPTION:'+icsEsc(c.teacher||''),
        'CATEGORIES:'+icsEsc(c.name+(c.teacher?','+c.teacher:'')), // 日历 App 可按课程/教师筛选（借鉴 wtlyu）
        'TRANSP:OPAQUE','X-MICROSOFT-CDO-BUSYSTATUS:BUSY',         // 上课=忙碌，Outlook/冲突检测正确识别
        'BEGIN:VALARM','TRIGGER:-PT'+alarmM+'M','ACTION:AUDIO','END:VALARM',
        'END:VEVENT');
      n++;
      if(settings.alarmEvents){ // 闹钟风格：课前 X 分钟一条独立事件，标题带课程和教室
        let hh=+tsA[0], mm=+tsA[1]-alarmM;
        if(mm<0){ mm+=60; hh--; }
        L.push('BEGIN:VEVENT',
          'UID:sched-al-'+c.id+'-'+uidKey+'@local',
          'DTSTART;TZID=Asia/Shanghai:'+ymd+'T'+pad2(hh)+pad2(mm)+'00',
          'DTEND;TZID=Asia/Shanghai:'+ymd+'T'+startHm+'00',
          'SUMMARY:'+icsEsc('⏰ '+alarmM+'分钟后上课：'+c.name+(c.room?'@'+c.room:'')),
          'DESCRIPTION:'+icsEsc(c.teacher||''),
          'END:VEVENT');
        n++;
      }
    });
    // 晚点名（宿舍，单/双周的某天晚上，自定义时间）
    const rc=state.rollCall;
    if(rc){
      const w=weekOf(ts);
      const hitDay=rc.day===(new Date(ts).getDay()||7);
      const hitPar=rc.parity==='odd'?w%2===1:w%2===0;
      if(w>=1&&w<=40&&hitDay&&hitPar){
        L.push('BEGIN:VEVENT',
          'UID:sched-rc-'+w+'@local',
          'DTSTART;TZID=Asia/Shanghai:'+ymd+'T'+rc.start.replace(':','')+'00',
          'DTEND;TZID=Asia/Shanghai:'+ymd+'T'+rc.end.replace(':','')+'00',
          'SUMMARY:'+icsEsc('晚点名'),
          'LOCATION:'+icsEsc(rcPlaceSeat(rc)),
          'DESCRIPTION:'+icsEsc('宿舍晚点名（'+(rc.parity==='odd'?'单周':'双周')+'）'),
          'CATEGORIES:晚点名',
          'TRANSP:OPAQUE','X-MICROSOFT-CDO-BUSYSTATUS:BUSY',
          'BEGIN:VALARM','TRIGGER:-PT'+alarmM+'M','ACTION:AUDIO','END:VALARM',
          'END:VEVENT');
        n++;
        if(settings.alarmEvents){
          let hh=+rc.start.slice(0,2), mm=+rc.start.slice(3)-alarmM;
          if(mm<0){ mm+=60; hh--; }
          L.push('BEGIN:VEVENT',
            'UID:sched-al-rc-'+w+'@local',
            'DTSTART;TZID=Asia/Shanghai:'+ymd+'T'+pad2(hh)+pad2(mm)+'00',
            'DTEND;TZID=Asia/Shanghai:'+ymd+'T'+rc.start.replace(':','')+'00',
            'SUMMARY:'+icsEsc('⏰ '+alarmM+'分钟后：晚点名'+(rcPlaceSeat(rc)?'（'+rcPlaceSeat(rc)+'）':'')),
            'END:VEVENT');
          n++;
        }
      }
    }
  }
  state.todos.forEach(td=>{ // 日程备注 → 当天全天事件（提醒在日历 App 里自行设置）
    const ymdN=td.date.replace(/-/g,'');
    let hsh=0; for(const ch of td.text) hsh=(hsh*31+ch.codePointAt(0))>>>0;
    const d2=new Date(parseYmd(td.date)+DAY);
    L.push('BEGIN:VEVENT',
      'UID:sched-todo-'+ymdN+'-'+hsh+'@local',
      'DTSTART;VALUE=DATE:'+ymdN,
      'DTEND;VALUE=DATE:'+(d2.getFullYear()+pad2(d2.getMonth()+1)+pad2(d2.getDate())),
      'SUMMARY:'+icsEsc(td.text),
      'CATEGORIES:日程',
      'TRANSP:TRANSPARENT',
      'END:VEVENT');
    n++;
  });
  L.push('END:VCALENDAR');
  return { text:foldICS(L.join('\r\n')), count:n };
}

/* ── 分享图（本周课表 → 图片，手机上直接弹系统分享；颜色跟随当前皮肤） ── */
function buildShareImage(){
  let days=settings.weekend===false?5:7;
  const N=state.timeTable.length;
  const fm0=parseYmd(state.meta.firstMonday)+(selWeek-1)*6048e5;
  if(days===5){ // 5 天模式下补课日（周六/日上课）也画进去，和页面看到的一致
    if(dayPlan(fm0+5*DAY).swap) days=6;
    if(dayPlan(fm0+6*DAY).swap) days=7;
  }
  const cs=getComputedStyle(document.documentElement), v=n=>cs.getPropertyValue(n).trim();
  const PAL=Array.from({length:12},(_,i)=>[v('--p'+i+'b'),v('--p'+i+'t')]);
  const x0=78, dayW=106, rowH=64, topH=132, footH=42;
  const W=Math.round(x0+days*dayW+16), H=Math.round(topH+N*rowH+footH);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const F='-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif';
  g.fillStyle=v('--bg'); g.fillRect(0,0,W,H);
  g.textAlign='left';
  g.fillStyle=v('--acc'); g.font='bold 30px '+F;
  g.fillText('第 '+selWeek+' 周', 16, 44);
  // 罗盘刻度带（签名元素）：标题下一条 3px 刻度
  g.fillStyle=v('--acc'); g.globalAlpha=.45;
  for(let i=0;i<28;i++) g.fillRect(16+i*7, 52, 2, 4+(i%6===0?4:0));
  g.globalAlpha=1;
  g.fillStyle=v('--tx2'); g.font='15px '+F;
  g.fillText(state.meta.semesterName+' · '+rangeOf(selWeek), 16, 78);
  const fm=parseYmd(state.meta.firstMonday)+(selWeek-1)*6048e5;
  const names=['一','二','三','四','五','六','日'];
  g.textAlign='center';
  for(let d=0;d<days;d++){
    const dts=new Date(fm+d*DAY), cx=x0+dayW*(d+.5);
    g.fillStyle=v('--tx2'); g.font='bold 14px '+F; g.fillText(names[d], cx, topH-36);
    g.font='12px '+F; g.fillText((dts.getMonth()+1)+'/'+dts.getDate(), cx, topH-14);
    const pl=dayPlan(fm+d*DAY);
    if(pl.swap||pl.holiday){ // 校历标记与页面一致
      g.fillStyle=pl.swap?v('--acc'):v('--tx2'); g.globalAlpha=.85; g.font='9px '+F;
      g.fillText(pl.swap?('补·'+names[pl.dow-1]):'休', cx, topH-58);
      g.globalAlpha=1;
    }
  }
  g.fillStyle=v('--tx2'); g.font='11px '+F;
  for(let s=1;s<=N;s++) g.fillText(String(s), x0-28, topH+rowH*(s-1)+rowH/2+4);
  g.strokeStyle=v('--line'); g.lineWidth=1;
  for(let s=0;s<=N;s++){ g.beginPath(); g.moveTo(x0,topH+rowH*s+0.5); g.lineTo(W-14,topH+rowH*s+0.5); g.stroke(); }
  const rr=(x,y,w,h,r)=>{g.beginPath(); if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h);};
  const wrap=(txt,font,maxW)=>{ g.font=font; const out=[]; let line=''; for(const ch of txt){ if(g.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch; } out.push(line); return out; };
  for(let d=0;d<days;d++){
    const blocks=occurrencesFor(fm+d*DAY).list.filter(o=>!o.ghost) // 校历覆盖层：变虚的不画
      .map(o=>Object.assign({},o.c,{startSection:o.s1,endSection:o.s2}))
      .sort((a,b)=>a.startSection-b.startSection);
    const clusters=[];
    for(const b of blocks){
      const l=clusters[clusters.length-1];
      if(l && b.startSection<=l.maxEnd){ l.items.push(b); l.maxEnd=Math.max(l.maxEnd,b.endSection); }
      else clusters.push({minStart:b.startSection,maxEnd:b.endSection,items:[b]});
    }
    for(const cl of clusters){
      const y=topH+rowH*cl.minStart+3, h=rowH*(cl.maxEnd-cl.minStart+1)-8;
      const cw2=(dayW-12-(cl.items.length-1)*4)/cl.items.length;
      cl.items.forEach((c,i)=>{
        const x=x0+dayW*d+6+i*(cw2+4);
        const pal=PAL[colorOf(c)];
        g.fillStyle=pal[0]; rr(x,y,cw2,h,10); g.fill();
        g.fillStyle=pal[1]; g.textAlign='left';
        wrap(c.name,'bold 12px '+F,cw2-10).slice(0,3).forEach((ln,li)=>g.fillText(ln,x+5,y+17+li*15));
        if(c.room){ g.font='10.5px '+F; g.globalAlpha=.8; g.fillText('@'+c.room, x+5, y+h-11); g.globalAlpha=1; }
      });
    }
  }
  g.textAlign='left'; g.fillStyle=v('--tx2'); g.font='11px '+F;
  g.fillText('由「海大课程表」生成', 16, H-16);
  cv.toBlob(blob=>{
    if(!blob) return toast('图没画出来，再试一次');
    const file=new File([blob],'海大课程表-第'+selWeek+'周.png',{type:'image/png'});
    const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      toast('分享图已生成，已保存到下载'); };
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'海大课程表 第'+selWeek+'周'}).catch(e=>{ if(e && e.name!=='AbortError') dl(); });
    } else dl();
  },'image/png');
}

/* ── 学期管理 ─────────────────────── */
let semMgmt=false; const semSel=new Set();
function openSemesters(mgmt){
  semMgmt=!!mgmt;
  const yearOf=s=>{ // 按开学日期归学年：8月起算新学年
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s.firstMonday||'')) return '未安排';
    const y=+s.firstMonday.slice(0,4);
    return (+s.firstMonday.slice(5,7)>=8) ? (y+'-'+(y+1)+'学年') : ((y-1)+'-'+y+'学年');
  };
  const sorted=[...db.semesters].sort((a,b)=>String(a.firstMonday||'').localeCompare(String(b.firstMonday||'')));
  const groups=[];
  sorted.forEach(s=>{
    const k=yearOf(s);
    let g=groups.find(x=>x.k===k); if(!g){ g={k,items:[]}; groups.push(g); }
    g.items.push(s);
  });
  groups.reverse(); // 新学年在上
  let rows='';
  groups.forEach(g=>{
    rows+='<div class="ygrp">'+g.k+'</div>';
    g.items.forEach(s=>{
      const cur=s.id===state.id;
      rows+='<div class="semrow'+(cur?' cur':'')+'" data-id="'+esc(s.id)+'">'+
        '<div class="si"><b>'+esc(s.name)+(cur?'<span class="tag2">当前</span>':'')+(db.pairId===s.id?'<span class="stag">TA</span>':'')+(s.tag?'<span class="stag">'+esc(s.tag)+'</span>':'')+'</b>'+
        '<small>'+(s.firstMonday||'未设')+' 开学 · '+s.courses.length+' 门课</small></div>'+
        (semMgmt
          ? '<span class="selmark'+(semSel.has(s.id)?' on':'')+'">✓</span>'
          : ((cur?'':'<button class="sw" data-id="'+esc(s.id)+'">切换</button>')+
             '<button class="ed" data-id="'+esc(s.id)+'">✎</button>'+
             (db.semesters.length>1?'<button class="dl2" data-id="'+esc(s.id)+'">删</button>':'')))+
        '</div>';
    });
  });
  const selN=semSel.size;
  openSheet('<h3>学期管理<button class="mgmtBtn" id="semMgmtBtn">'+(semMgmt?'完成':'管理')+'</button><button class="x" id="shX"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>'+rows+
    (semMgmt
      ? '<div class="sheetbtns"><button id="semClearSel" class="dangerBtn"'+(selN?'':' disabled')+'>'+('清空选中学期课程信息（'+selN+'）')+'</button></div>'+
        '<div class="hint">清空只删课程，学期保留。</div>'
      : '<div class="sheetbtns"><button class="pri" id="semNew">＋ 新建学期</button></div>'+
        '<div class="hint">每学期一份课表，互不影响。</div>'));
  document.getElementById('semMgmtBtn').onclick=()=>{ semSel.clear(); openSemesters(!semMgmt); };
  if(semMgmt){
    document.querySelectorAll('.semrow').forEach(el=>el.onclick=()=>{
      const id=el.dataset.id;
      if(semSel.has(id)) semSel.delete(id); else semSel.add(id);
      openSemesters(true);
    });
    const clr=document.getElementById('semClearSel');
    clr.onclick=()=>{
      if(!semSel.size) return;
      if(!confirm('清空 '+semSel.size+' 个学期的全部课程？（学期本身保留）')) return;
      const snap=JSON.stringify(db);
      let touchedCurrent=false;
      db.semesters.forEach(s=>{ if(semSel.has(s.id)){ s.courses=[]; if(s.id===state.id) touchedCurrent=true; } });
      if(touchedCurrent) state.courses=[];
      semSel.clear(); save(); closeSheet(); render(); toast('已清空选中课程，可撤回',{label:'撤回',fn:()=>restoreUndo(snap)});
    };
  }else{
    document.querySelectorAll('.semrow .si').forEach(el=>el.onclick=()=>openSemEdit(el.dataset.id));
    document.querySelectorAll('.semrow .sw').forEach(el=>el.onclick=()=>{
      switchSem(el.dataset.id); closeSheet(); toast('已切换到「'+state.meta.semesterName+'」');
    });
    document.querySelectorAll('.semrow .ed').forEach(el=>el.onclick=()=>openSemEdit(el.dataset.id));
    document.querySelectorAll('.semrow .dl2').forEach(el=>el.onclick=()=>{
      const s=db.semesters.find(x=>x.id===el.dataset.id);
      if(!confirm('删除学期「'+s.name+'」及其 '+s.courses.length+' 门课？（建议先导出备份）')) return;
      const snap=JSON.stringify(db);
      db.semesters=db.semesters.filter(x=>x.id!==el.dataset.id);
      if(db.pairId===el.dataset.id) db.pairId=null; // 删的正好是 TA 的课表 → 解除叠加
      if(state.id===el.dataset.id){
        state=semView(db.semesters[0]); selWeek=Math.max(1,curWeek());
      }
      save(); closeSheet(); render(); toast('已删除学期「'+s.name+'」，可撤回',{label:'撤回',fn:()=>restoreUndo(snap)});
    });
    document.getElementById('semNew').onclick=()=>{
      const rec={ id:genId(), name:'新学期', tag:'', firstMonday:fmtYmd(mondayOf(Date.now())),
                  demo:false, timeTable:defaultTimeTable(), courses:[] };
      db.semesters.push(rec);
      state=semView(rec); selWeek=1; save(); render();
      openSemEdit(rec.id);
      toast('已创建，请设置名称和开学日期');
    };
  }
}
function openSemEdit(id){

  openSheet('<h3>编辑学期<button class="x" id="shX"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>'+
    '<div class="frow"><label>学期名称</label><input type="text" id="eName" maxlength="40" value="'+esc(s.name)+'"></div>'+
    '<div class="frow"><label>文字标签（如：大一上 / 大二下）</label><input type="text" id="eTag" maxlength="12" value="'+esc(s.tag||'')+'"></div>'+
    '<div class="frow"><label>第 1 周的周一日期（开学周）</label><input type="date" id="eFM" value="'+(s.firstMonday||'')+'">'+
    '<div class="hint" id="ePrev" style="color:var(--acc);font-weight:600"></div>'+

/* ── 行式文本与 WakeUp 格式解析（导入自动识别用） ──
   AI 识图提示词：用户复制给豆包等识图 AI，回复贴回导入框，取 <<<HAIDA-BEGIN/END>>> 之间 */
const AI_PROMPT=[
'你是课表识别助手。请把我发的课程表截图转成一行一节课的纯文本，格式：',
'周一 1-2节 课程名 教师 教室 1-16周',
'要求：',
'1. 一行只写一节课；同一门课有多个时段就写多行',
'2. 教师或教室没有就写 -',
'3. 周次写实际范围，单周/双周在后面加（单）/（双），全学期写 1-16周',
'4. 只输出课表行，不要解释、不要表格',
'5. 第一行写 <<<HAIDA-BEGIN>>>，最后一行写 <<<HAIDA-END>>>'].join('\n');
const JW_URL='https://jwxt.shmtu.edu.cn/shmtu/courseTableForStd!courseTable.action';
const BOOKMARKLET="javascript:(function(){var t=window.table0;if(!t||!t.activities){alert('没找到课表数据：请先打开教务「信息查询→我的课表」再点我');return}var A=t.activities,I={},k;for(k in A){var idx=+k,d=Math.floor(idx/13)+1,s=idx%13+1;A[k].forEach(function(a){var w=a.vaildWeeks||'',W=[],i;for(i=1;i<w.length;i++)if(w.charAt(i)=='1')W.push(i);if(!W.length)return;var n=(a.courseName||'未命名').replace(/\\s*[（(][^()（）]*_[^()（）]*[)）]\\s*$/,'');var x=n+'|'+(a.teacherName||'')+'|'+(a.roomName||'')+'|'+w+'|'+d;var it=I[x];if(!it)it=I[x]={name:n,teacher:a.teacherName||'',room:a.roomName||'',weeks:W,dayOfWeek:d,startSection:s,endSection:s};else{if(s<it.startSection)it.startSection=s;if(s>it.endSection)it.endSection=s}})}var C=[];for(k in I)C.push(I[k]);C.sort(function(a,b){return a.dayOfWeek-b.dayOfWeek||a.startSection-b.startSection});var el=document.querySelector('#courseTableForm input.calendar-text'),sem=el&&el.value?el.value:'我的课表';var D={meta:{semesterName:sem,firstMonday:null,demo:false},timeTable:[{s:'08:00',e:'08:45'},{s:'08:55',e:'09:40'},{s:'10:00',e:'10:45'},{s:'10:55',e:'11:40'},{s:'11:50',e:'12:35'},{s:'13:30',e:'14:15'},{s:'14:25',e:'15:10'},{s:'15:20',e:'16:05'},{s:'16:15',e:'17:00'},{s:'17:10',e:'17:55'},{s:'18:30',e:'19:15'},{s:'19:25',e:'20:10'},{s:'20:20',e:'21:05'}],courses:C};var txt=JSON.stringify(D);try{var b=new Blob([txt],{type:'application/json'}),a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download='海大课程表-'+sem+'.json';document.body.appendChild(a2);a2.click();a2.remove()}catch(e){}try{var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}catch(e){}alert('已导出'+C.length+'门课程（'+sem+'），JSON已复制\\n→ 打开「海大课程表.html」⇅ 粘贴导入')})();";
function parseClassLines(txt){
  let body=String(txt);
  const b=body.lastIndexOf('<<<HAIDA-BEGIN>>>'), e=body.lastIndexOf('<<<HAIDA-END>>>');
  if(b>-1&&e>b) body=body.slice(b+'<<<HAIDA-BEGIN>>>'.length, e); // AI 回复只取标记之间，容忍前后废话
  const half=s=>String(s) // 全角→半角（AI/输入法常给全角数字和破折号）
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[－–—]/g,'-').replace(/～/g,'-').replace(/，/g,',')
    .replace(/（/g,'(').replace(/）/g,')');
  const dayMap={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7,'天':7};
  const out=[];
  for(const raw of body.split(/\r?\n/)){
    const line=half(raw).trim();
    if(!line||line.startsWith('#')||line.startsWith('<<<')) continue;
    const m=line.match(/^(?:周|星期)\s*([一二三四五六日天])\s*(\d+)\s*(?:[-~]\s*(\d+))?\s*节\s*(.*)$/);
    if(!m) continue;
    const d=dayMap[m[1]], s1=+m[2], s2=m[3]?+m[3]:s1;
    let ws=null; const rest=[];
    for(const t of m[4].split(/\s+/).filter(Boolean)){
      const wm=t.match(/^第?(\d+(?:[-,]\d+)*)\s*周?\s*(?:\(\s*([单双])\s*周?\s*\))?$/);
      if(wm&&!ws&&/周|-|,|\(/.test(t)){ // 纯数字（如教室"232"）不当周次
        let arr; try{ arr=parseWeeks(wm[1]); }catch(e2){ rest.push(t); continue; }
        if(wm[2]==='单') arr=arr.filter(w=>w%2===1);
        if(wm[2]==='双') arr=arr.filter(w=>w%2===0);
        ws=arr; continue;
      }
      if(t==='-'||t==='—'||t==='无') continue; // AI 占位符
      rest.push(t);
    }
    if(!rest.length) continue;
    if(!ws) ws=Array.from({length:16},(_,i)=>i+1);
    const name=rest[0], extra=rest.slice(1);
    let teacher='', room='';
    if(extra.length===1){ if(/\d/.test(extra[0])) room=extra[0]; else teacher=extra[0]; }
    else if(extra.length>=2){ teacher=extra[0]; room=extra[1]; }
    out.push({name:String(name).slice(0,60),teacher:String(teacher).slice(0,40),room:String(room).slice(0,40),
      weeks:ws.filter(w=>w>=1&&w<=40),dayOfWeek:d,startSection:Math.min(s1,s2),endSection:Math.max(s1,s2)});
  }
  return out;
}
/* WakeUp 课表导出（.wakeup_schedule）：五行各一个 JSON（语义已从 WakeupSchedule_BUPT 源码核实：
   day 1=周一..7=周日；type 0=每周 1=单周 2=双周；startDate=yyyy-MM-dd） */
function tryWakeup(txt){
  const lines=String(txt).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<5) return null;
  const P=[];
  for(let i=0;i<5;i++){ try{ P.push(JSON.parse(lines[i])); }catch(e){ return null; } }
  const td=P[1], tb=P[2], cb=P[3], cd=P[4];
  if(!Array.isArray(td)||!tb||typeof tb!=='object'||!Array.isArray(cb)||!Array.isArray(cd)) return null;
  if(tb.tableName===undefined||!td.length||td[0].node===undefined) return null;
  const tt=td.slice().sort((a,b)=>(a.node||0)-(b.node||0))
    .map(d=>({s:String(d.startTime||'08:00'),e:String(d.endTime||'08:45')}));
  if(tt.length<4) return null;
  let fm=String(tb.startDate||'').trim();
  const m=fm.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  fm=m?(m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0')):state.meta.firstMonday;
  const baseById={};
  cb.forEach(b=>{ if(b&&b.id!=null) baseById[String(b.id)]=b; });
  const courses=[];
  cd.forEach(d=>{
    if(!d||typeof d!=='object') return;
    const base=baseById[String(d.tableId)];
    const s=Math.max(1,Math.round(+d.startNode)||1), step=Math.max(1,Math.round(+d.step)||1);
    const w0=Math.max(1,Math.round(+d.startWeek)||1), w1=Math.min(40,Math.round(+d.endWeek)||w0);
    const weeks=[];
    for(let w=w0;w<=w1;w++){
      if(+d.type===1&&w%2===0) continue;
      if(+d.type===2&&w%2===1) continue;
      weeks.push(w);
    }
    if(!weeks.length) return;
    courses.push({name:String((base&&base.courseName)||d.courseName||'未命名').slice(0,60),
      teacher:String(d.teacher||'').slice(0,40),room:String(d.room||'').slice(0,40),
      weeks,dayOfWeek:Math.min(7,Math.max(1,Math.round(+d.day)||1)),
      startSection:s,endSection:s+step-1});
  });
  return {name:String(tb.tableName||'我的课表').slice(0,40),firstMonday:fm,timeTable:tt,courses};
}

    : '<div class="sheetbtns" style="flex-direction:column">'+

      '<button id="oDl">导出备份文件（.json，全部学期）</button>'+

      [5,10,15,20].map(m=>'<button data-v="'+m+'"'+((settings.icalAlarm||15)===m?' class="on"':'')+'>' + m + ' 分钟</button>').join('')+

      }

          }catch(e){ bad++; }

        db={currentId:(j.currentId&&sems.some(s=>s.id===j.currentId))?j.currentId:sems[0].id,

      const ok=save(); closeSheet(); render();
      if(ok) toast('已导入 '+st.courses.length+' 门课程（仅当前学期）');

      const blob=new Blob([ics.text],{type:'text/calendar'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='课表-'+fmtYmd(Date.now())+'.ics';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      toast('已导出 '+ics.count+' 节课的日历文件');
    };
  }
}

/* ── 周次面板 & 滑动翻周 ── */
function prevWeek(){ if(selWeek>1){selWeek--;render();slideGrid(1);} }
function nextWeek(){ if(selWeek<40){selWeek++;render();slideGrid(-1);} }
function slideGrid(dir){ // 翻周的方向感
  const g=document.querySelector('.grid'); if(!g) return;
  g.style.animation='none'; void g.offsetWidth;
  g.style.animation='gridIn .22s ease-out';
  g.style.setProperty('--dx', dir>0?'10px':'-10px');
}
function openWeekPicker(){
  const cw=curWeek();
  let maxW=20;
  state.courses.forEach(c=>c.weeks.forEach(w=>{ if(w>maxW) maxW=w; }));
  let btns='';
  for(let w=1;w<=maxW;w++)
    btns+='<button data-w="'+w+'"'+(w===selWeek?' class="on"':(w===cw?' class="tdy"':''))+'>'+w+'</button>';
  openSheet('<h3>选择周次<button class="x" id="shX"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>'+
    '<div class="wpgrid">'+btns+'</div>'+
    '<div class="quick" style="margin-top:12px">'+
    '<button id="wpToday">回到本周</button>'+
    '<button id="wpAll"'+(settings.showAll?' style="color:var(--acc);border-color:var(--acc)"':'')+'>'+(settings.showAll?'只看本周':'显示非本周课程')+'</button>'+
    (pairSem()?'<button id="wpPair"'+(settings.pairOn?' style="color:var(--acc);border-color:var(--acc)"':'')+'>'+(settings.pairOn?'取消叠加TA课表':'叠加TA课表')+'</button>':'')+'</div>'+
    '<div class="hint">周次不对？去「☰ 学期」改开学日期。</div>');
  document.querySelectorAll('.wpgrid button').forEach(b=>b.onclick=()=>{ selWeek=+b.dataset.w; closeSheet(); render(); });
  document.getElementById('wpToday').onclick=()=>{ selWeek=Math.max(1,cw||1); closeSheet(); render(); };
  document.getElementById('wpAll').onclick=()=>{ settings.showAll=!settings.showAll; saveSettings(); closeSheet(); render(); };
  const wpPairBtn=document.getElementById('wpPair');
  if(wpPairBtn) wpPairBtn.onclick=()=>{ settings.pairOn=!settings.pairOn; saveSettings(); closeSheet(); render(); };
}

/* ── 事件绑定 ── */
document.getElementById('wkLabel').onclick=openWeekPicker;
document.getElementById('wPrevL').onclick=prevWeek;
document.getElementById('wNextL').onclick=nextWeek;
document.getElementById('backNow').onclick=()=>{ plusSel=null; selWeek=Math.max(1,curWeek()); render(); };
document.getElementById('btnSet').onclick=openSettings;
document.getElementById('btnSem').onclick=()=>openSemesters();
document.getElementById('btnIo').onclick=()=>openIo('import');
document.getElementById('fab').onclick=()=>openForm(null);
(function(){ // 触摸/鼠标左右滑动翻周
  const m=document.getElementById('main');
  let sx=0, sy=0, on=false, mx0=null;
  m.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; on=true; },{passive:true});
  m.addEventListener('touchend',e=>{
    if(!on) return; on=false;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0) nextWeek(); else prevWeek(); }
  },{passive:true});
  m.addEventListener('mousedown',e=>{ mx0=e.clientX; });
  m.addEventListener('mouseup',e=>{
    if(mx0===null) return;
    const dx=e.clientX-mx0; mx0=null;
    if(Math.abs(dx)>80 && !String(getSelection())){ // 拖选文字时不翻周
      if(dx<0) nextWeek(); else prevWeek();
    }
  });
})();

/* ── 启动 ── */
settings.theme=settings.theme||'light';
settings.skin=settings.skin||'qingxin';
settings.weekend=(settings.weekend===undefined)?true:settings.weekend;
settings.secMode=settings.secMode||'auto';
settings.icalAlarm=settings.icalAlarm||15;
settings.alarmEvents=!!settings.alarmEvents;
settings.showAll=(settings.showAll===undefined)?true:!!settings.showAll; // 默认淡化显示非本周
applyTheme();
try{
  db=load();
  const raw0=localStorage.getItem(STORE_KEY);
  if(!db){
    if(raw0){ // 原始数据损坏：先备份再兜底，绝不直接覆盖
      try{ localStorage.setItem(STORE_KEY+'.bak', raw0); }catch(e){}
      setTimeout(()=>toast('这份文件没读出来——原数据没丢，已存成 .bak，改回 .json 就能在「导入」里恢复'),600);
    }
    const s0=syncSem(freshState(true));
    db={currentId:s0.id, semesters:[s0]};
    if(!raw0) save();
  }
  if(!settings.m1){ // 一次性校准（2026-10 核对：官方作息 + 第1周周一=2026-09-14）
    let chg=false; const names=[];
    db.semesters.forEach(s=>{
      if(JSON.stringify(s.timeTable)===JSON.stringify(OLD_TT)){ s.timeTable=defaultTimeTable(); chg=true; if(!names.includes(s.name)) names.push(s.name); }
      if(s.firstMonday==='2026-09-07'){ s.firstMonday='2026-09-14'; chg=true; if(!names.includes(s.name)) names.push(s.name); }
    });
    if(chg && confirm('一次性校准：把「'+names.join('、')+'」的作息换成海大官方版、第1周周一改为 2026-09-14（教务处校历核实）。继续？')){
      localStorage.setItem(STORE_KEY, JSON.stringify(db));
    }
    settings.m1=true; saveSettings(); // 无论是否确认都不再重复询问
  }
  state=semView(db.semesters.find(s=>s.id===db.currentId)||db.semesters[0]);
  const raw1=localStorage.getItem(STORE_KEY);
  if(!raw1 || !raw1.includes('"semesters"')) save(); // 旧格式迁移后立即落盘
}catch(e){ console.warn('启动恢复异常',e); }
if(!state){ state=freshState(false); db={currentId:state.id,semesters:[syncSem(state)]}; save(); } // 首次运行空库兜底：给一个默认学期，避免 render 读 state.meta 崩
selWeek=Math.max(1,curWeek());
render();
if(!settings.seenSwipeHint){
  settings.seenSwipeHint=true; saveSettings();
  setTimeout(()=>toast('小技巧：左右滑动课表就能翻周'),900);
}
</script>
</body>
